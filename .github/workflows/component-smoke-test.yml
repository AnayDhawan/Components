name: component smoke test

# Two modes on purpose.
#
# pull_request  -> hard fail. A PR that changes components.json is claiming a ref
#                  works, and this is what checks that claim before it merges. On
#                  pull_request this also tests the entries the PR itself added or
#                  changed (scripts/smoke-test.mjs --diff), not just the fixed
#                  curated sample below, and posts the combined results as a PR
#                  comment (#12) so a contributor doesn't have to open the CI log.
# schedule      -> soft fail. Nothing is being claimed, so upstream rot must not
#                  show up as a red X on a branch nobody touched. validate.yml
#                  and this job are the only PR gates; registry health stays soft.
on:
  pull_request:
    paths:
      - "components.json"
      - "scripts/smoke-test.mjs"
      - ".github/workflows/component-smoke-test.yml"
  schedule:
    # Mondays 07:00 UTC, an hour after the registry health check.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # Only exercised on pull_request (see the "Comment results" step's `if:`).
  # schedule/workflow_dispatch runs have no PR to comment on and never touch it.
  pull-requests: write

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: fetch + build a curated sample
    runs-on: ubuntu-latest
    # From-scratch npm installs plus Vite builds, curated sample plus whatever a
    # PR touched. Generous, but a hang on a dead registry should not burn a full
    # runner hour.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # --diff needs the PR's base commit reachable to compare components.json
          # against it; a shallow checkout only has the merge commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Smoke-test curated registry refs
        # No `continue-on-error` here: the script itself decides. --soft makes it
        # exit 0 while still writing the report, so a scheduled run surfaces the
        # findings in the job summary without going red.
        run: |
          node scripts/smoke-test.mjs ${{ github.event_name == 'pull_request' && ' ' || '--soft' }}

      - name: Smoke-test entries this PR added or changed
        # The curated sample above is a fixed regression baseline; it does not
        # necessarily include whatever ref this PR actually touched. This is the
        # step that checks the PR's own claim.
        if: github.event_name == 'pull_request'
        run: |
          node scripts/smoke-test.mjs --diff "${{ github.event.pull_request.base.sha }}"

      - name: Comment results on the PR
        # Runs even if either smoke-test step failed above, so a broken ref shows
        # up as a comment, not just a red check the contributor has to click into.
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");

            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            let body = summaryPath && fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, "utf8").trim()
              : "";
            if (!body) body = "No smoke-test summary was produced.";

            const MAX = 60000; // GitHub comment bodies cap at 65536 chars
            if (body.length > MAX) body = body.slice(0, MAX) + "\n\n...(truncated, see the full run for the rest)";

            const marker = "<!-- component-smoke-test-bot -->";
            body = `${marker}\n## Registry smoke test results\n\n${body}\n\n[Full run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
